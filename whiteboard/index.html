<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRDT 协同白板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="toolbar">
    <span class="brand">协同白板</span>
    <label>颜色 <input type="color" id="color" value="#1a1a1a" /></label>
    <label>笔宽 <input type="range" id="width" min="1" max="30" value="4" /></label>
    <button id="undo" title="只撤销自己的笔迹">撤销</button>
    <button id="redo">重做</button>
    <button id="snapshot">保存快照</button>
    <button id="export-png">导出 PNG</button>
    <button id="export-json">导出 JSON</button>
  </header>

  <aside id="sidebar">
    <h3>图层</h3>
    <ul id="layers"></ul>
    <button id="add-layer">+ 新建图层</button>
  </aside>

  <main id="board"></main>

  <footer id="replay-bar">
    <button id="replay-play" title="从当前位置播放">▶ 回放</button>
    <input type="range" id="replay-slider" min="0" max="0" value="0" step="1" />
    <span id="replay-label">0 / 0</span>
    <button id="replay-exit">退出回放</button>
  </footer>

  <footer id="statusbar">
    <span id="stat-fps">-- fps</span>
    <span id="stat-ops">ops: 0</span>
    <span id="stat-strokes">笔迹: 0</span>
    <span id="stat-peers">在线: 1 标签页</span>
    <span id="stat-latency">同步延迟: 0ms</span>
  </footer>

  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
