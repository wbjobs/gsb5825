<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRDT 协同白板</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <button id="btn-pen" class="active" title="画笔">✏️ 笔</button>
      <button id="btn-eraser" title="橡皮">🧹 橡皮</button>
      <input type="color" id="color" value="#1a1a2e" title="颜色">
      <label>粗细 <input type="range" id="size" min="1" max="30" value="4"></label>
    </div>
    <div class="group">
      <button id="btn-undo" title="撤销 (Ctrl+Z)">↩ 撤销</button>
      <button id="btn-redo" title="重做 (Ctrl+Y)">↪ 重做</button>
    </div>
    <div class="group">
      <button id="btn-export" title="导出 PNG">💾 导出</button>
      <button id="btn-snapshot" title="创建版本快照">📸 快照</button>
    </div>
    <div class="group" id="status"></div>
  </header>

  <aside id="sidebar">
    <h3>图层</h3>
    <ul id="layers"></ul>
    <h3>版本快照</h3>
    <ul id="snapshots"></ul>
  </aside>

  <main id="stage">
    <canvas id="board"></canvas>
    <canvas id="replay"></canvas>
  </main>

  <footer id="timeline-bar">
    <span id="replay-label">实时</span>
    <input type="range" id="timeline" min="0" max="0" value="0" step="1">
    <button id="btn-exit-replay">返回实时</button>
  </footer>

  <script src="js/crdt.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
